AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Free Tier DevOps Project - Infrastructure as Code'

Parameters:
  InstanceProfileName:
    Type: String
    Default: EC2InstanceRole
    Description: Name of the EC2 Instance Profile

Resources:
  # Security Group for EC2
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for web server - Allow HTTP and SSH
      VpcId: !Ref DefaultVPC
      SecurityGroupIngress:
        # Allow SSH from anywhere (restrict this in production!)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        # Allow HTTP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access
        # Allow application port 8080 (for Java app)
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Application port
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: WebServerSG

  # Get Default VPC
  DefaultVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.31.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: DefaultVPC

  # Get Default Subnet
  DefaultSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DefaultVPC
      CidrBlock: 172.31.0.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: DefaultSubnet

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DefaultVPC
      InternetGatewayId: !Ref InternetGateway

  # Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DefaultVPC
      Tags:
        - Key: Name
          Value: PublicRT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DefaultSubnet
      RouteTableId: !Ref PublicRouteTable

  # S3 Bucket for Build Artifacts
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aws-devops-artifacts-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: ArtifactBucket

  # EC2 Instance (t2.micro - Free Tier)
  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0  # Amazon Linux 2 AMI (Free Tier eligible)
      InstanceType: t2.micro
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfileName
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      SubnetId: !Ref DefaultSubnet
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          
          # Update system
          yum update -y
          
          # Install Java
          yum install java-11-amazon-corretto-devel -y
          
          # Install Maven
          yum install maven -y
          
          # Install Git
          yum install git -y
          
          # Install CloudWatch agent
          yum install amazon-cloudwatch-agent -y
          
          # Create application directory
          mkdir -p /opt/webapp
          cd /opt/webapp
          
          # Download artifact from S3
          aws s3 cp s3://aws-devops-artifacts-${AWS::AccountId}-${AWS::Region}/app.jar . || echo "Artifact not ready yet"
          
          # Create a simple startup script
          cat > /opt/webapp/start.sh << 'EOF'
          #!/bin/bash
          cd /opt/webapp
          java -jar app.jar > /var/log/webapp.log 2>&1 &
          EOF
          
          chmod +x /opt/webapp/start.sh
          
          # Add CloudWatch Logs
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -c default \
            -s
          
          # Signal success
          echo "EC2 Instance initialized successfully" > /var/log/init.log
      Tags:
        - Key: Name
          Value: WebServer
        - Key: Environment
          Value: Development

  # CloudWatch Log Group
  WebAppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ec2/webapp
      RetentionInDays: 7

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref WebServerInstance
    Export:
      Name: WebServerInstanceId

  PublicIP:
    Description: Public IP of EC2 Instance
    Value: !GetAtt WebServerInstance.PublicIp
    Export:
      Name: WebServerPublicIP

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref WebServerSecurityGroup
    Export:
      Name: WebServerSecurityGroupId

  ArtifactBucketName:
    Description: S3 Bucket for Artifacts
    Value: !Ref ArtifactBucket
    Export:
      Name: ArtifactBucketName

  ArtifactBucketArn:
    Description: S3 Bucket ARN
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: ArtifactBucketArn

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to SSH into the instance
    ConstraintDescription: Must be the name of an existing EC2 KeyPair